<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Mference 2.0 GitHub Social Preview: Qwen 3.6 35B-A3B on a 16 GB Mac in Swift 6.1 and Metal 3">
