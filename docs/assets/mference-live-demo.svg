  <text x="48" y="411" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#8b949e">visible: 249 tok · wall: 27.96s · <tspan fill="#3fb950" font-weight="700">MTP: 82.1% (457/182 = 2.51 tok/round)</tspan></text>

