    <rect class="bar" x="628" y="111" width="12" height="23" rx="2" style="animation-delay:0.8s"/>
    <rect class="bar" x="644" y="109" width="12" height="25" rx="2" style="animation-delay:1.0s"/>
    <rect class="bar" x="660" y="113" width="12" height="21" rx="2" style="animation-delay:1.2s"/>
