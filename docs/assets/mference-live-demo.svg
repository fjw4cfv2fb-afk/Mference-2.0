  <text x="702" y="111" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8b949e">Memory Pressure</text>
  <text x="702" y="131" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" font-weight="800" fill="#3fb950">GREEN · FLAT</text>

  <text x="554" y="164" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">NVMe Expert Cache</text>
  <text x="858" y="164" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#e6edf3">32 Slots (Pread + Tail Warm)</text>
  <text x="554" y="188" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">Resident Core + MTP</text>
  <text x="858" y="188" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#e6edf3">1.41 GB + Slab (MADV_RANDOM)</text>
  <text x="554" y="212" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">Stability Guard</text>
