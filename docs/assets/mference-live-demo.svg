  <text x="554" y="340" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">MTP Acceptance (AIME)</text>
  <text x="858" y="340" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#3fb950">83.1% avg (94.3% peak)</text>
  <text x="554" y="364" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">GDN Hybrid Rollback</text>
