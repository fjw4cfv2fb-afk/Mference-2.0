  <text x="554" y="388" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">INT4 Weight Surgery</text>
  <text x="858" y="388" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#58a6ff">BF16 Scales · 0 Nibbles Changed</text>
